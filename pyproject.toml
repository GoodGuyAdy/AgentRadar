[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentradar-sdk"
version = "0.2.1"
description = "AI agent observability SDK — track runs, LLM calls, tool calls, and errors."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "AgentRadar", email = "sdk@agentradar.dev" }]
keywords = ["ai", "agents", "observability", "llm", "monitoring", "tracing", "opentelemetry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0",
]

[project.optional-dependencies]
openai = [
    "openinference-instrumentation-openai>=0.1.0",
]
anthropic = [
    "openinference-instrumentation-anthropic>=0.1.0",
]
langchain = [
    "openinference-instrumentation-langchain>=0.1.0",
]
crewai = [
    "openinference-instrumentation-crewai>=0.1.0",
]
llamaindex = [
    "openinference-instrumentation-llama-index>=0.1.0",
]
all = [
    "openinference-instrumentation-openai>=0.1.0",
    "openinference-instrumentation-anthropic>=0.1.0",
    "openinference-instrumentation-langchain>=0.1.0",
    "openinference-instrumentation-crewai>=0.1.0",
    "openinference-instrumentation-llama-index>=0.1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "hatch>=1.12",
]

[project.urls]
Homepage = "https://agent-radar.in"
Documentation = "https://api.agent-radar.in/docs"
Repository = "https://github.com/GoodGuyAdy/AgentRadar"
Issues = "https://github.com/GoodGuyAdy/AgentRadar/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentradar", "src/agent_radar", "src/agentradar_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
strict = true
files = ["src"]
